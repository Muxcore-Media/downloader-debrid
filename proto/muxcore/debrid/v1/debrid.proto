syntax = "proto3";

package muxcore.debrid.v1;

option go_package = "github.com/Muxcore-Media/downloader-debrid/proto/gen/muxcore/debrid/v1;debridv1";

// DebridDownloaderService bridges cloud debrid providers (Real-Debrid, AllDebrid).
service DebridDownloaderService {
  rpc UnrestrictLink(UnrestrictLinkRequest) returns (UnrestrictLinkResponse);
  rpc ListDownloads(ListDownloadsRequest) returns (ListDownloadsResponse);
  rpc DeleteDownload(DeleteDownloadRequest) returns (DeleteDownloadResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message UnrestrictLinkRequest {
  string link = 1;
  string password = 2;
}

message UnrestrictLinkResponse {
  string id = 1;
  string filename = 2;
  string download = 3;
  int64 filesize = 4;
  string host = 5;
}

message DownloadItem {
  string id = 1;
  string filename = 2;
  string status = 3;
  string link = 4;
  int64 filesize = 5;
}

message ListDownloadsRequest {
  int32 limit = 1;
}

message ListDownloadsResponse {
  repeated DownloadItem items = 1;
}

message DeleteDownloadRequest {
  string id = 1;
}

message DeleteDownloadResponse {
  bool success = 1;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  string provider = 1;
  bool supports_unrestrict = 2;
  bool supports_cloud_downloads = 3;
  repeated string hosts = 4;
}
